  function loadInitialState(){

      if (backup) return migrateState(JSON.parse(backup));

    return migrateState(JSON.parse(document.getElementById('state-data').textContent));

  function applyThemeById(id){
    const root = document.documentElement;
    const props = ['--bg','--surface','--surface-alt','--text','--text-muted','--border','--theme-accent'];
    if (!id || id === 'auto'){
      props.forEach(p => root.style.removeProperty(p));
      try { localStorage.removeItem('pedidos_theme_id'); } catch(e){}
      return;
    }
    const t = THEME_CATALOG.find(x => x.id === id);
    if (!t) return;
    root.style.setProperty('--bg', t.bgBody);
    root.style.setProperty('--surface', t.bgCard);
    root.style.setProperty('--surface-alt', t.bgInput);
    root.style.setProperty('--text', t.textMain);
    root.style.setProperty('--text-muted', t.textSec);
    root.style.setProperty('--border', t.border);
    root.style.setProperty('--theme-accent', t.accent);
    try { localStorage.setItem('pedidos_theme_id', id); } catch(e){}
  }
  function currentThemeId(){
    try { return localStorage.getItem('pedidos_theme_id'); } catch(e){ return null; }
  }
  try { const savedThemeId = currentThemeId(); if (savedThemeId) applyThemeById(savedThemeId); } catch(e){}

  const root = document.getElementById('app-root');

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function migrateState(raw){
    if (raw && raw.lists) return raw;
    const lists = [];
    if (raw.peixe) lists.push({ id:'peixe', label:'Peixe', type:'grouped', accent:'teal', dayLabels:['Terça','Sexta'], categories: raw.peixe.categories, history: raw.peixe.history || [] });
    if (raw.makro) lists.push({ id:'makro', label:'Makro', type:'flat', accent:'green', items: raw.makro.items, history: raw.makro.history || [] });
    if (raw.recheio) lists.push({ id:'recheio', label:'Recheio', type:'flat', accent:'terracotta', items: raw.recheio.items, history: raw.recheio.history || [] });
    return { lists };
  }

  function getList(id){ return state.lists.find(l => l.id === id); }
  function getActiveList(){ return getList(activeListId); }
  function nameField(list){ return list.type === 'grouped' ? 'item' : 'produto'; }
  function flattenItems(list){ return list.type === 'grouped' ? list.categories.flatMap(c => c.items) : list.items; }
  function slugify(s){
    const stripped = String(s).normalize('NFD').replace(new RegExp('[̀-ͯ]', 'g'), '');
    return stripped.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'') || 'lista';
  }

  function ensureUids(){
    state.lists.forEach(list => {
      flattenItems(list).forEach(it => { if (!it._uid) it._uid = 'u' + (uidCounter++) + Math.random().toString(36).slice(2,6); });
      if (list.type === 'grouped') list.categories.forEach(c => { if (!c._uid) c._uid = 'c' + (uidCounter++); });
    });
  }

  // ---------- modal (theme picker + export selection) ----------
  function renderThemeModal(){
    const activeId = currentThemeId();
    let body = `<label class="theme-row${!activeId?' active':''}" data-action="apply-theme" data-theme-id="auto">
      <span class="theme-swatch" style="background:linear-gradient(135deg,#fff 50%,#222 50%)"></span>
      <span class="theme-label">Automático (sistema)</span>
    </label>`;
    let lastCat = null;
    THEME_CATALOG.forEach(t => {
      if (t.category !== lastCat){ body += `<div class="theme-cat">${esc(t.category)}</div>`; lastCat = t.category; }
      body += `<label class="theme-row${activeId===t.id?' active':''}" data-action="apply-theme" data-theme-id="${t.id}">
        <span class="theme-swatch" style="background:${t.bgBody}; border-color:${t.border}"><span class="theme-swatch-dot" style="background:${t.accent}"></span></span>
        <span class="theme-label">${esc(t.label)}</span>
      </label>`;
    });
    return `<div class="modal-backdrop" data-action="close-modal">
      <div class="modal-box">
        <div class="modal-header"><h3>Escolher tema</h3><button type="button" class="modal-close" data-action="close-modal">✕</button></div>
        <div class="modal-list">${body}</div>
      </div>
    </div>`;
  }

  function renderExportModal(){
    const list = getActiveList();
    let body = '';
    if (list.type === 'grouped'){
      list.categories.forEach(cat => {
        if (!cat.items.length) return;
        body += `<div class="theme-cat">${esc(cat.name)}</div>`;
        cat.items.forEach(it => {
          const qty = it.d1 || it.d0 || '-';
          body += `<label class="export-row"><input type="checkbox" data-action="toggle-export-item" data-uid="${it._uid}" ${modalState.selected.has(it._uid)?'checked':''}><span class="export-name">${esc(it.item)}</span><span class="export-qty">${esc(qty)}</span></label>`;
        });
      });
    } else {
      list.items.forEach(it => {
        body += `<label class="export-row"><input type="checkbox" data-action="toggle-export-item" data-uid="${it._uid}" ${modalState.selected.has(it._uid)?'checked':''}><span class="export-name">${esc(it.produto)}</span><span class="export-qty">${esc(it.qtd||'-')}</span></label>`;
      });
    }
    const kindLabel = { share:'Partilhar', image:'Imagem', pdf:'PDF' }[modalState.exportKind];
    return `<div class="modal-backdrop" data-action="close-modal">
      <div class="modal-box">
        <div class="modal-header"><h3>Selecionar para enviar</h3><button type="button" class="modal-close" data-action="close-modal">✕</button></div>
        <div class="modal-quick">
          <button type="button" class="ghost" data-action="select-all-export">Todos</button>
          <button type="button" class="ghost" data-action="select-none-export">Nenhum</button>
        </div>
        <div class="modal-list">${body}</div>
        <div class="modal-footer">
          <button type="button" class="primary-share" data-action="confirm-export">${kindLabel} (${modalState.selected.size})</button>
        </div>
      </div>
    </div>`;
  }

  function renderModal(){
    if (!modalState) return '';
    if (modalState.kind === 'theme') return renderThemeModal();
    if (modalState.kind === 'export') return renderExportModal();
    return '';
  }

  function openExportModal(kind){
    const list = getActiveList();
    const field = nameField(list);
    const selected = new Set();
    flattenItems(list).forEach(it => {
      const q = list.type === 'grouped' ? (it.d1 || it.d0 || '') : (it.qtd || '');
      if (!NOT_ORDERED.has(q.trim())) selected.add(it._uid);
    });
    modalState = { kind:'export', exportKind: kind, selected };
    render();
  }

  // ---------- undo / redo ----------
  function snapshot(){ return JSON.stringify(state); }
  function pushUndo(){
    undoStack.push(snapshot());
    if (undoStack.length > 50) undoStack.shift();
    redoStack = [];
  }
  function undo(){
    if (!undoStack.length) return;
    redoStack.push(snapshot());
    state = JSON.parse(undoStack.pop());
    if (!getActiveList()) activeListId = state.lists[0].id;
    scheduleSave(); render();
  }
  function redo(){
    if (!redoStack.length) return;
    undoStack.push(snapshot());
    state = JSON.parse(redoStack.pop());
    if (!getActiveList()) activeListId = state.lists[0].id;
    scheduleSave(); render();
  }

  // ---------- frequency (for "mais pedido" sort) ----------
  function computeFrequencyMap(list){
    const field = nameField(list);
    const map = new Map();
    (list.history || []).forEach(h => {
      const arr = list.type === 'grouped' ? h.data.flatMap(c => c.items) : h.data;
      arr.forEach(it => {
        const q = list.type === 'grouped' ? (it.d1 || it.d0 || '') : (it.qtd || '');
        if (NOT_ORDERED.has(q.trim())) return;
        const key = (it[field] || '').trim().toLowerCase();
        if (!key) return;
        map.set(key, (map.get(key) || 0) + 1);
      });
    });
    return map;
  }

  function matchesQuery(it, field, q){
    if (!q) return true;
    const hay = ((it[field]||'') + ' ' + (it.fornecedor||'') + ' ' + (it.tipo||'')).toLowerCase();
    return hay.includes(q);
  }

  function computeRows(items, list, opts){
    const field = nameField(list);
    const q = (opts.query || '').trim().toLowerCase();
    let rows = items.map((it, idx) => ({ it, idx })).filter(r => matchesQuery(r.it, field, q));
    if (opts.sortMode === 'name'){
      rows.sort((a,b) => (a.it[field]||'').localeCompare(b.it[field]||'', 'pt'));
    } else if (opts.sortMode === 'freq'){
      const freq = opts.freqMap;
      rows.sort((a,b) => (freq.get((b.it[field]||'').trim().toLowerCase())||0) - (freq.get((a.it[field]||'').trim().toLowerCase())||0));
    }
    return rows;
  }

  // ---------- rendering ----------
  function renderTabsNav(){
    const tabs = state.lists.map(l => `
      <button type="button" class="tab-btn${l.id===activeListId?' active':''}" data-action="switch-list" data-list-id="${l.id}"
        style="--tab-accent:var(--acc-${l.accent}); --tab-accent-soft:var(--acc-${l.accent}-soft); --tab-accent-text:var(--acc-${l.accent}-soft-text)"
        data-uid="${l.id}">
        <span class="t-label">${esc(l.label)}</span>
      </button>`).join('');
    return `<div class="tabs" id="tabs-row">${tabs}<button type="button" class="tab-add" data-action="add-list" title="Nova lista">+</button></div>`;
  }

  function lastHistoryValue(list, name, key){
    if (!list.history || !list.history.length) return undefined;
    const field = nameField(list);
    const h = list.history[0];
    const arr = list.type === 'grouped' ? h.data.flatMap(c => c.items) : h.data;
    const match = arr.find(x => (x[field]||'').trim().toLowerCase() === (name||'').trim().toLowerCase());
    return match ? match[key] : undefined;
  }

  function deltaBadge(list, name, key, current){
    const prev = lastHistoryValue(list, name, key);
    if (prev === undefined) return '';
    const cur = (current||'').trim(), prevTrim = (prev||'').trim();
    if (cur === prevTrim) return '';
    const curNum = parseFloat(cur.replace(',', '.')), prevNum = parseFloat(prevTrim.replace(',', '.'));
    let icon = '•', cls = 'delta-changed';
    if (!isNaN(curNum) && !isNaN(prevNum)){
      if (curNum > prevNum){ icon = '▲'; cls = 'delta-up'; }
      else if (curNum < prevNum){ icon = '▼'; cls = 'delta-down'; }
      else return '';
    }
    return `<span class="delta ${cls}" title="Última vez: ${esc(prevTrim || '—')}">${icon}</span>`;
  }

  function rowInputsHtml(it, list, idx, catIdx, draggable){
    const cat = catIdx != null ? ` data-cat="${catIdx}"` : '';
    const handle = draggable ? `<span class="drag-handle" data-uid="${it._uid}">⠿</span>` : '';
    const recv = `<td class="recv-cell"><input type="checkbox" data-action="toggle-received" data-idx="${idx}"${cat} ${it.received?'checked':''} title="Recebido"></td>`;
    const fornCell = showFornecedor ? `<td><input class="cell" data-field="fornecedor" data-idx="${idx}"${cat} value="${esc(it.fornecedor)}"></td>` : '';
    if (list.type === 'grouped'){
      return `${recv}<td class="handle-cell">${handle}</td>
        <td><textarea class="cell prod-input" rows="1" data-field="item" data-idx="${idx}"${cat}>${esc(it.item)}</textarea></td>
        ${fornCell}
        <td class="num"><span class="qty-wrap"><input class="cell num" inputmode="text" data-field="d0" data-idx="${idx}"${cat} value="${esc(it.d0)}">${deltaBadge(list, it.item, 'd0', it.d0)}</span></td>
        <td class="num"><span class="qty-wrap"><input class="cell num" inputmode="text" data-field="d1" data-idx="${idx}"${cat} value="${esc(it.d1)}">${deltaBadge(list, it.item, 'd1', it.d1)}</span></td>
        <td class="del-cell"><button type="button" class="danger" data-action="del-item" data-idx="${idx}"${cat}>✕</button></td>`;
    }
    return `${recv}<td class="handle-cell">${handle}</td>
      <td class="prod-cell">
        <textarea class="cell prod-input" rows="1" data-field="produto" data-idx="${idx}">${esc(it.produto)}</textarea>
        <input class="cell cell-sub" data-field="tipo" data-idx="${idx}" value="${esc(it.tipo)}" placeholder="tipo">
      </td>
      <td class="num"><span class="qty-wrap"><input class="cell num" inputmode="text" data-field="qtd" data-idx="${idx}" value="${esc(it.qtd)}">${deltaBadge(list, it.produto, 'qtd', it.qtd)}</span></td>
      <td><input class="cell" data-field="un" data-idx="${idx}" value="${esc(it.un)}"></td>
      <td class="del-cell"><button type="button" class="danger" data-action="del-item" data-idx="${idx}">✕</button></td>`;
  }

  function renderGroupedTable(list){
    const draggable = sortMode === 'manual' && !searchQuery;
    const freqMap = sortMode === 'freq' ? computeFrequencyMap(list) : null;
    const bodyColspan = showFornecedor ? 6 : 5;
    let rows = '', pos = 0;
    list.categories.forEach((cat, ci) => {
      const displayRows = computeRows(cat.items, list, { query: searchQuery, sortMode, freqMap });
      if (searchQuery && !displayRows.length) return;
      rows += `<tr class="cat-row"><td colspan="${bodyColspan}">${esc(cat.name)}</td>
        <td class="del-cell"><button type="button" class="danger" data-action="del-cat" data-cat="${ci}">✕</button></td></tr>`;
      displayRows.forEach(r => {
        const parity = (pos++ % 2 === 0) ? 'row-even' : 'row-odd';
        const cls = [parity, r.it.struck?'struck':'', r.it.received?'received':''].join(' ');
        rows += `<tr class="${cls}" data-cat="${ci}" data-uid="${r.it._uid}">${rowInputsHtml(r.it, list, r.idx, ci, draggable)}</tr>`;
      });
      rows += `<tr class="add-item-row"><td colspan="${bodyColspan + 1}"><button type="button" class="add-row" data-action="add-item" data-cat="${ci}">+ item em ${esc(cat.name)}</button></td></tr>`;
    });
    return `<table>
      <thead><tr><th></th><th></th><th>Item</th>${showFornecedor ? '<th>Fornecedor</th>' : ''}<th class="num">${list.dayLabels[0]}</th><th class="num">${list.dayLabels[1]}</th><th></th></tr></thead>
      <tbody id="rows-container">${rows}</tbody>
    </table>`;
  }

  function renderFlatTable(list){
    const draggable = sortMode === 'manual' && !searchQuery;
    if (sortMode === 'tipo'){
      const filtered = list.items.map((it, idx) => ({ it, idx })).filter(r => matchesQuery(r.it, 'produto', searchQuery.trim().toLowerCase()));
      const groups = {};
      filtered.forEach(r => {
        const key = (r.it.tipo || '').trim() || 'Sem categoria';
        (groups[key] = groups[key] || []).push(r);
      });
      const keys = Object.keys(groups).sort((a,b) => a==='Sem categoria' ? 1 : b==='Sem categoria' ? -1 : a.localeCompare(b,'pt'));
      let rows = '', pos = 0;
      keys.forEach(key => {
        rows += `<tr class="cat-row"><td colspan="6">${esc(key)}</td></tr>`;
        groups[key].forEach(r => {
          const parity = (pos++ % 2 === 0) ? 'row-even' : 'row-odd';
          const cls = [parity, r.it.received?'received':''].join(' ');
          rows += `<tr class="${cls}" data-uid="${r.it._uid}">${rowInputsHtml(r.it, list, r.idx, null, false)}</tr>`;
        });
      });
      return `<table>
        <thead><tr><th></th><th></th><th>Produto</th><th class="num">Qtd</th><th>Un</th><th></th></tr></thead>
        <tbody id="rows-container">${rows}
          <tr class="add-item-row"><td colspan="6"><button type="button" class="add-row" data-action="add-item">+ item</button></td></tr>
        </tbody></table>`;
    }
    const freqMap = sortMode === 'freq' ? computeFrequencyMap(list) : null;
    const displayRows = computeRows(list.items, list, { query: searchQuery, sortMode, freqMap });
    let rows = displayRows.map((r, pos) => {
      const parity = (pos % 2 === 0) ? 'row-even' : 'row-odd';
      const cls = [parity, r.it.received?'received':''].join(' ');
      return `<tr class="${cls}" data-uid="${r.it._uid}">${rowInputsHtml(r.it, list, r.idx, null, draggable)}</tr>`;
    }).join('');
    return `<table>
      <thead><tr><th></th><th></th><th>Produto</th><th class="num">Qtd</th><th>Un</th><th></th></tr></thead>
      <tbody id="rows-container">${rows}
        <tr class="add-item-row"><td colspan="6"><button type="button" class="add-row" data-action="add-item">+ item</button></td></tr>
      </tbody></table>`;
  }

  function renderHistoryPanel(list){
    if (!historyOpen) return '';
    const hist = list.history || [];
    if (!hist.length) return `<div class="history-panel"><p class="hist-empty">Ainda não há encomendas guardadas no histórico desta lista.</p></div>`;
    return `<div class="history-panel">` + hist.map(h => `
      <div class="hist-row">
        <span class="hist-date">${esc(new Date(h.savedAt).toLocaleString('pt-PT', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}))}</span>
        <button type="button" data-action="load-history" data-hid="${h.id}">Carregar</button>
        <button type="button" class="danger" data-action="del-history" data-hid="${h.id}">✕</button>
      </div>`).join('') + `</div>`;
  }

  function dynamicAreaHtml(tableHtml){
    const hint = (sortMode !== 'manual' || searchQuery)
      ? '<p class="hint">Arrastar para reordenar só funciona em "Ordem manual" e sem pesquisa.</p>' : '';
    return `${hint}<div class="table-scroll">${tableHtml}</div>`;
  }

  function resetLabel(){
    return 'Limpar quantidades';
  }

  function renderActiveCard(){
    const list = getActiveList();
    const inner = list.type === 'grouped' ? renderGroupedTable(list) : renderFlatTable(list);
    const dateStr = new Date().toLocaleDateString('pt-PT');
    const sortOptions = list.type === 'grouped'
      ? `<option value="manual">Ordem manual</option><option value="name">Nome (A-Z)</option><option value="freq">Mais pedido</option>`
      : `<option value="manual">Ordem manual</option><option value="name">Nome (A-Z)</option><option value="tipo">Agrupar por tipo</option><option value="freq">Mais pedido</option>`;
    return `<div class="search-row">
      <input type="search" class="search-input" id="search-input" placeholder="Pesquisar item, fornecedor ou tipo…" value="${esc(searchQuery)}">
      <select class="sort-select" id="sort-select">${sortOptions}</select>
    </div>
    ${list.type === 'grouped' ? `<label class="col-toggle"><input type="checkbox" id="toggle-fornecedor" ${showFornecedor?'checked':''}> Mostrar fornecedor</label>` : ''}
    <div class="card" id="export-card" style="--accent:var(--acc-${list.accent}); --tab-accent-row:var(--acc-${list.accent}-soft)">
      <div class="card-head" style="background:var(--acc-${list.accent})">
        <button type="button" class="list-name" data-action="rename-list" title="Renomear">${esc(list.label)} ✎</button>
        <div class="card-head-actions">
          <button type="button" data-action="duplicate-list">Duplicar</button>
          <button type="button" data-action="del-list">Apagar lista</button>
        </div>
      </div>
      <div class="export-caption" id="export-caption">Gerado em ${dateStr}</div>
      <div id="dynamic-area">${dynamicAreaHtml(inner)}</div>
    </div>
    <div class="toolbar">
      <button type="button" class="ghost" data-action="reset-list">${resetLabel()}</button>
      ${list.type==='grouped' ? '<button type="button" class="ghost" data-action="add-cat">+ categoria</button>' : ''}
      <button type="button" class="ghost" data-action="save-history">Guardar no histórico</button>
      <button type="button" class="ghost" data-action="toggle-history">${historyOpen ? 'Fechar histórico' : 'Repetir encomenda'}</button>
    </div>
    ${renderHistoryPanel(list)}`;
  }

  function render(){
    ensureUids();
    if (!getActiveList()) activeListId = state.lists[0].id;
    root.innerHTML = `
      <div class="wrap">
        <div class="header-row">
          <h1>Pedidos da Cozinha</h1>
          <button type="button" class="theme-toggle" data-action="open-theme-modal" title="Escolher tema">🎨</button>
        </div>
        ${renderTabsNav()}
        ${renderActiveCard()}
        <footer class="note">As listas ficam sincronizadas neste link, em qualquer aparelho.</footer>
      </div>
      <div class="bottom-bar">
        <span class="status" id="status-text">—</span>
        <div class="bar-actions">
          <button type="button" class="icon-btn" id="btn-undo" title="Desfazer" ${undoStack.length?'':'disabled'}>↶</button>
          <button type="button" class="icon-btn" id="btn-redo" title="Refazer" ${redoStack.length?'':'disabled'}>↷</button>
          <button type="button" class="primary-share" id="btn-share">📤 Partilhar</button>
          <button type="button" id="btn-image">Imagem</button>
          <button type="button" id="btn-pdf">PDF</button>
          <button type="button" class="ghost" data-action="export-all-pdf" title="Todas as listas num PDF">Tudo (PDF)</button>
        </div>
      </div>
      ${renderModal()}`;
    setStatus(saveState);
    document.getElementById('btn-share').addEventListener('click', () => openExportModal('share'));
    document.getElementById('btn-image').addEventListener('click', () => openExportModal('image'));
    document.getElementById('btn-pdf').addEventListener('click', () => openExportModal('pdf'));
    document.getElementById('btn-undo').addEventListener('click', undo);
    document.getElementById('btn-redo').addEventListener('click', redo);
    const searchEl = document.getElementById('search-input');
    searchEl.addEventListener('input', () => { searchQuery = searchEl.value; renderTableOnly(); });
    const sortEl = document.getElementById('sort-select');
    sortEl.value = sortMode;
    sortEl.addEventListener('change', () => { sortMode = sortEl.value; render(); });
    const fornEl = document.getElementById('toggle-fornecedor');
    if (fornEl) fornEl.addEventListener('change', () => {
      showFornecedor = fornEl.checked;
      try { localStorage.setItem('pedidos_show_fornecedor', String(showFornecedor)); } catch(e){}
      renderTableOnly();
    });
    wireDrag();
    autoGrowAll();
  }

  // Re-render only the table area (keeps focus in the search box while typing)
  function renderTableOnly(){
    const list = getActiveList();
    const inner = list.type === 'grouped' ? renderGroupedTable(list) : renderFlatTable(list);
    document.getElementById('dynamic-area').innerHTML = dynamicAreaHtml(inner);
    wireRowDrag();
    autoGrowAll();
  }

  function setStatus(kind){
    saveState = kind;
    const el = document.getElementById('status-text');
    if (!el) return;
    el.className = 'status';
    const map = {
      idle: 'Pronto', editing: 'A escrever…', saving: 'A guardar…',
      saved: 'Guardado ✓ · ' + new Date().toLocaleTimeString('pt-PT', {hour:'2-digit', minute:'2-digit'}),
      local: 'Guardado só neste aparelho', error: 'Falha ao guardar — tenta novamente',
      nocap: 'Sincronização indisponível'
    };
    el.textContent = map[kind] || '';
    if (kind === 'saved') el.classList.add('saved');
    if (kind === 'error') el.classList.add('error');
  }

  function scheduleSave(){
    dirty = true;
    setStatus('editing');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(doSave, 2200);
  }

  async function doSave(){
    if (!dirty) return;
    if (!capArtifact){
      try { localStorage.setItem('pedidos_cozinha_backup', JSON.stringify(state)); } catch(e){}
      dirty = false; setStatus('local'); return;
    }
    setStatus('saving');
    try {
      await capArtifact.publish(buildFullDocument());
      dirty = false; setStatus('saved');
    } catch (e) {
      if (e && e.code === 'conflict') return;
      setStatus('error');
    }
  }

  function buildFullDocument(){
    const links = Array.from(document.querySelectorAll('link')).map(l => l.outerHTML).join('\n');
    const extraMeta = Array.from(document.querySelectorAll('meta')).filter(m => {
      if (m.hasAttribute('charset')) return false;
      return (m.getAttribute('name') || '').toLowerCase() !== 'viewport';
    }).map(m => m.outerHTML).join('\n');
    const title = document.title;
    const appScript = document.getElementById('app-script').outerHTML;
    const html2canvasScript = document.querySelector('script[src*="html2canvas"]');
    const jspdfScript = document.querySelector('script[src*="jspdf"]');
    return `<!doctype html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
${extraMeta}
<title>${esc(title)}</title>
${links}
<style>${CSS_TEXT}</style>
</head>
<body>
<div id="app-root"></div>
<script id="state-data" type="application/json">${JSON.stringify(state)}<\/script>
${html2canvasScript ? html2canvasScript.outerHTML : ''}
${jspdfScript ? jspdfScript.outerHTML : ''}
${appScript}
</body>
</html>`;
  }

  function setField(list, cat, idx, field, val){
    const ref = cat != null ? list.categories[cat].items : list.items;
    ref[idx][field] = val;
  }

  function saveHistory(list){
    const ref = flattenItems(list);
    const snap = { id: Date.now().toString(36), savedAt: new Date().toISOString(),
      data: list.type === 'grouped' ? JSON.parse(JSON.stringify(list.categories)) : JSON.parse(JSON.stringify(ref)) };
    list.history.unshift(snap);
    if (list.history.length > 20) list.history.length = 20;
    historyOpen = true;
  }
  function loadHistory(list, id){
    const entry = list.history.find(h => h.id === id);
    if (!entry) return;
    if (list.type === 'grouped') list.categories = JSON.parse(JSON.stringify(entry.data));
    else list.items = JSON.parse(JSON.stringify(entry.data));
    historyOpen = false;
  }
  function delHistory(list, id){ list.history = list.history.filter(h => h.id !== id); }

  function autoGrow(el){
    el.style.height = 'auto';
    el.style.height = el.scrollHeight + 'px';
  }

  function autoGrowAll(){
    document.querySelectorAll('textarea.prod-input').forEach(autoGrow);
  }

  root.addEventListener('input', e => {
    const t = e.target;
    if (!t.matches('input.cell, textarea.cell')) return;
    if (t.matches('textarea.prod-input')) autoGrow(t);
    if (!dirty) pushUndo();
    const list = getActiveList();
    const cat = t.dataset.cat !== undefined ? Number(t.dataset.cat) : null;
    const idx = Number(t.dataset.idx);
    setField(list, cat, idx, t.dataset.field, t.value);
    scheduleSave();
  });

  root.addEventListener('click', e => {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const action = btn.dataset.action;

    if (action === 'switch-list'){
      activeListId = btn.dataset.listId;
      historyOpen = false; searchQuery = ''; sortMode = 'manual';
      sessionStorage.setItem('pedidos_active_list', activeListId);
      render();
      return;
    }
    if (action === 'open-theme-modal'){ modalState = { kind:'theme' }; render(); return; }
    if (action === 'apply-theme'){ applyThemeById(btn.dataset.themeId); modalState = null; render(); return; }
    if (action === 'close-modal'){ modalState = null; render(); return; }
    if (action === 'toggle-export-item'){
      const uid = btn.dataset.uid;
      if (btn.checked) modalState.selected.add(uid); else modalState.selected.delete(uid);
      const footerBtn = document.querySelector('.modal-footer .primary-share');
      if (footerBtn) footerBtn.textContent = footerBtn.textContent.replace(/\(\d+\)/, '(' + modalState.selected.size + ')');
      return;
    }
    if (action === 'select-all-export'){
      flattenItems(getActiveList()).forEach(it => modalState.selected.add(it._uid));
      render();
      return;
    }
    if (action === 'select-none-export'){
      modalState.selected.clear();
      render();
      return;
    }
    if (action === 'confirm-export'){
      const { exportKind, selected } = modalState;
      modalState = null;
      render();
      if (exportKind === 'share') shareActiveList(selected);
      else exportAs(exportKind, selected);
      return;
    }
    if (action === 'add-list'){
      const name = prompt('Nome da nova lista:');
      if (!name || !name.trim()) return;
      pushUndo();
      const id = slugify(name) + '-' + Date.now().toString(36);
      const accent = PALETTE[state.lists.length % PALETTE.length];
      state.lists.push({ id, label: name.trim(), type:'flat', accent, items: [], history: [] });
      activeListId = id; historyOpen = false; searchQuery = ''; sortMode = 'manual';
      scheduleSave(); render();
      return;
    }

    const list = getActiveList();
    if (action === 'rename-list'){
      const name = prompt('Novo nome da lista:', list.label);
      if (!name || !name.trim()) return;
      pushUndo();
      list.label = name.trim();
      scheduleSave(); render();
      return;
    }
    if (action === 'del-list'){
      if (state.lists.length <= 1){ alert('Tem de haver pelo menos uma lista.'); return; }
      if (!confirm('Apagar a lista "' + list.label + '" e tudo o que tem?')) return;
      pushUndo();
      state.lists = state.lists.filter(l => l.id !== list.id);
      activeListId = state.lists[0].id;
      scheduleSave(); render();
      return;
    }
    if (action === 'toggle-history'){ historyOpen = !historyOpen; render(); return; }
    if (action === 'save-history'){ pushUndo(); saveHistory(list); scheduleSave(); render(); return; }
    if (action === 'load-history'){
      if (!confirm('Substituir os itens atuais por esta encomenda guardada? Podes editar depois de carregar.')) return;
      pushUndo(); loadHistory(list, btn.dataset.hid); scheduleSave(); render();
      return;
    }
    if (action === 'del-history'){ pushUndo(); delHistory(list, btn.dataset.hid); scheduleSave(); render(); return; }
    if (action === 'toggle-received'){
      const cat = btn.dataset.cat !== undefined ? Number(btn.dataset.cat) : null;
      const idx = Number(btn.dataset.idx);
      const ref = cat != null ? list.categories[cat].items : list.items;
      ref[idx].received = btn.checked;
      scheduleSave();
      const row = btn.closest('tr');
      if (row) row.classList.toggle('received', btn.checked);
      return;
    }
    if (action === 'duplicate-list'){
      pushUndo();
      const clone = JSON.parse(JSON.stringify(list));
      clone.id = slugify(list.label) + '-copia-' + Date.now().toString(36);
      clone.label = list.label + ' (cópia)';
      clone.accent = PALETTE[state.lists.length % PALETTE.length];
      clone.history = [];
      const pos = state.lists.findIndex(l => l.id === list.id);
      state.lists.splice(pos + 1, 0, clone);
      activeListId = clone.id;
      scheduleSave(); render();
      return;
    }
    if (action === 'export-all-pdf'){ exportAllLists('pdf'); return; }
    if (action === 'export-all-image'){ exportAllLists('image'); return; }

    if (action === 'reset-list'){
      if (list.type === 'grouped'){
        if (!confirm('Limpar as quantidades de ' + list.dayLabels.join(' e ') + ' para todos os itens?')) return;
        pushUndo();
        list.categories.forEach(cat => cat.items.forEach(it => { it.d0 = '-'; it.d1 = '-'; }));
      } else {
        if (!confirm('Limpar as quantidades desta lista?')) return;
        pushUndo();
        list.items.forEach(it => { it.qtd = '-'; });
      }
    } else if (action === 'add-item'){
      pushUndo();
      if (list.type === 'grouped'){
        const ci = Number(btn.dataset.cat);
        list.categories[ci].items.push({ item:'Novo item', fornecedor:'', d0:'', d1:'' });
      } else {
        list.items.push({ produto:'Novo produto', qtd:'', un:'', tipo:'' });
      }
    } else if (action === 'del-item'){
      pushUndo();
      const idx = Number(btn.dataset.idx);
      if (list.type === 'grouped'){
        const ci = Number(btn.dataset.cat);
        list.categories[ci].items.splice(idx, 1);
      } else {
        list.items.splice(idx, 1);
      }
    } else if (action === 'del-cat'){
      if (!confirm('Apagar esta categoria inteira?')) return;
      pushUndo();
      list.categories.splice(Number(btn.dataset.cat), 1);
    } else if (action === 'add-cat'){
      pushUndo();
      list.categories.push({ name:'Nova categoria', items:[] });
    } else {
      return;
    }
    scheduleSave();
    render();
  });

  document.addEventListener('keydown', e => {
    const mod = e.ctrlKey || e.metaKey;
    if (!mod) return;
    if (e.key.toLowerCase() === 'z' && !e.shiftKey){ e.preventDefault(); undo(); }
    else if (e.key.toLowerCase() === 'y' || (e.key.toLowerCase() === 'z' && e.shiftKey)){ e.preventDefault(); redo(); }
  });

  // ---------- drag reorder (pointer events: works for mouse + touch) ----------
  function wireDrag(){
    wireRowDrag();
    wireTabDrag();
  }

  function wireRowDrag(){
    const container = document.getElementById('rows-container');
    if (!container) return;
    let dragRow = null, pointerId = null, startY = 0, moved = false, scopeAttr = null, scopeVal = null;

    container.querySelectorAll('.drag-handle').forEach(handle => {
      handle.addEventListener('pointerdown', e => {
        const row = handle.closest('tr');
        dragRow = row; pointerId = e.pointerId; startY = e.clientY; moved = false;
        scopeAttr = row.dataset.cat !== undefined ? 'cat' : null;
        scopeVal = scopeAttr ? row.dataset.cat : null;
        handle.setPointerCapture(pointerId);
      });
      handle.addEventListener('pointermove', e => {
        if (!dragRow || e.pointerId !== pointerId) return;
        if (!moved && Math.abs(e.clientY - startY) > 6) moved = true;
        if (!moved) return;
        e.preventDefault();
        dragRow.classList.add('dragging');
        const siblings = Array.from(container.querySelectorAll('tr[data-uid]')).filter(r => {
          if (r === dragRow) return false;
          if (scopeAttr) return r.dataset.cat === scopeVal;
          return true;
        });
        let placed = false;
        for (const sib of siblings){
          const rect = sib.getBoundingClientRect();
          const mid = rect.top + rect.height / 2;
          if (e.clientY < mid){ sib.parentNode.insertBefore(dragRow, sib); placed = true; break; }
        }
        if (!placed && siblings.length){
          const last = siblings[siblings.length - 1];
          last.parentNode.insertBefore(dragRow, last.nextSibling);
        }
      });
      handle.addEventListener('pointerup', e => {
        if (!dragRow || e.pointerId !== pointerId) return;
        dragRow.classList.remove('dragging');
        if (moved) commitRowOrder(scopeAttr ? Number(scopeVal) : null);
        dragRow = null; moved = false;
      });
    });
  }

  function commitRowOrder(catIdx){
    pushUndo();
    const list = getActiveList();
    const selector = catIdx != null ? `tr[data-uid][data-cat="${catIdx}"]` : 'tr[data-uid]';
    const uids = Array.from(document.querySelectorAll('#rows-container ' + selector)).map(r => r.dataset.uid);
    const targetArr = catIdx != null ? list.categories[catIdx].items : list.items;
    const byUid = new Map(targetArr.map(it => [it._uid, it]));
    const newArr = uids.map(u => byUid.get(u)).filter(Boolean);
    // keep any items not present in the dragged scope (shouldn't happen) appended
    targetArr.forEach(it => { if (!newArr.includes(it)) newArr.push(it); });
    if (catIdx != null) list.categories[catIdx].items = newArr;
    else list.items = newArr;
    scheduleSave();
    render();
  }

  function wireTabDrag(){
    const row = document.getElementById('tabs-row');
    if (!row) return;
    let dragTab = null, pointerId = null, startX = 0, moved = false;
    row.querySelectorAll('.tab-btn').forEach(tab => {
      tab.addEventListener('pointerdown', e => {
        dragTab = tab; pointerId = e.pointerId; startX = e.clientX; moved = false;
        tab.setPointerCapture(pointerId);
      });
      tab.addEventListener('pointermove', e => {
        if (!dragTab || e.pointerId !== pointerId) return;
        if (!moved && Math.abs(e.clientX - startX) > 8) moved = true;
        if (!moved) return;
        e.preventDefault();
        dragTab.classList.add('dragging');
        const siblings = Array.from(row.querySelectorAll('.tab-btn')).filter(t => t !== dragTab);
        let placed = false;
        for (const sib of siblings){
          const rect = sib.getBoundingClientRect();
          const mid = rect.left + rect.width / 2;
          if (e.clientX < mid){ sib.parentNode.insertBefore(dragTab, sib); placed = true; break; }
        }
        if (!placed && siblings.length){
          const last = siblings[siblings.length - 1];
          last.parentNode.insertBefore(dragTab, last.nextSibling);
        }
      });
      tab.addEventListener('pointerup', e => {
        if (!dragTab || e.pointerId !== pointerId) return;
        dragTab.classList.remove('dragging');
        if (moved){
          pushUndo();
          const ids = Array.from(row.querySelectorAll('.tab-btn')).map(t => t.dataset.listId);
          const byId = new Map(state.lists.map(l => [l.id, l]));
          state.lists = ids.map(id => byId.get(id)).filter(Boolean);
          scheduleSave();
          render();
        }
        dragTab = null; moved = false;
      });
    });
  }

  function blobToBase64(blob){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onloadend = () => resolve(String(reader.result).split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }

  async function tryNativeShare(file, title){
    if (!navigator.share || !navigator.canShare || !navigator.canShare({ files: [file] })) return false;
    try {
      await navigator.share({ files: [file], title });
      return true;
    } catch (e) {
      if (e && e.name === 'AbortError') return true; // user closed the share sheet — don't also trigger a download
      return false;
    }
  }

  // Hands a generated file to whatever channel this environment supports:
  // the native Android app bridge, the browser's share sheet, or (in the
  // hosted Claude artifact) the downloads capability.
  async function offerFile(blob, filename, mime){
    if (window.AndroidShare && window.AndroidShare.shareFile){
      const b64 = await blobToBase64(blob);
      window.AndroidShare.shareFile(b64, filename, mime);
      return;
    }
    const file = new File([blob], filename, { type: mime });
    const shared = await tryNativeShare(file, filename);
    if (shared) return;
    if (!capDownloads){ alert('A partilha/exportação não está disponível neste visualizador.'); return; }
    await capDownloads.save({ filename, data: blob });
  }

  // Clean, read-only order sheet: just names and quantities, no editing
  // chrome (handles, checkboxes, delete buttons, borders that look like a
  // form). Rendered off-screen at a fixed width so it never depends on the
  // phone's current orientation/viewport and never needs to scroll.
  function buildCleanExportHtml(list, selectedUids){
    const dateStr = new Date().toLocaleDateString('pt-PT');
    const keep = it => !selectedUids || selectedUids.has(it._uid);
    let rows = '';
    if (list.type === 'grouped'){
      list.categories.forEach(cat => {
        const items = cat.items.filter(keep);
        if (!items.length) return;
        rows += `<tr class="clean-cat"><td colspan="3">${esc(cat.name)}</td></tr>`;
        items.forEach((it, ii) => {
          const parity = ii % 2 === 0 ? 'clean-even' : 'clean-odd';
          rows += `<tr class="${parity}${it.struck?' clean-struck':''}">
            <td class="clean-name">${esc(it.item)}</td>
            <td class="clean-qty">${esc(it.d0) || '-'}</td>
            <td class="clean-qty">${esc(it.d1) || '-'}</td>
          </tr>`;
        });
      });
      return `<div class="clean-export" style="--accent:var(--acc-${list.accent})">
        <div class="clean-head">
          <div class="clean-title">${esc(list.label)}</div>
          <div class="clean-date">${dateStr}</div>
        </div>
        <table class="clean-table">
          <thead><tr><th>Item</th><th>${esc(list.dayLabels[0])}</th><th>${esc(list.dayLabels[1])}</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
    }
    list.items.filter(keep).forEach((it, ii) => {
      const parity = ii % 2 === 0 ? 'clean-even' : 'clean-odd';
      rows += `<tr class="${parity}">
        <td class="clean-name">${esc(it.produto)}</td>
        <td class="clean-qty">${esc(it.qtd) || '-'}</td>
      </tr>`;
    });
    return `<div class="clean-export" style="--accent:var(--acc-${list.accent})">
      <div class="clean-head">
        <div class="clean-title">${esc(list.label)}</div>
        <div class="clean-date">${dateStr}</div>
      </div>
      <table class="clean-table">
        <thead><tr><th>Produto</th><th>Qtd</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
  }

  async function captureListCanvas(list, selectedUids){
    const holder = document.createElement('div');
    holder.style.cssText = 'position:fixed; left:-10000px; top:0; width:560px;';
    holder.innerHTML = buildCleanExportHtml(list, selectedUids);
    document.body.appendChild(holder);
    const canvas = await html2canvas(holder.firstElementChild, { backgroundColor: '#ffffff', scale: 2 });
    document.body.removeChild(holder);
    return canvas;
  }

  async function shareActiveList(selectedUids){
    const list = getActiveList();
    try {
      const canvas = await captureListCanvas(list, selectedUids);
      const dateSlug = new Date().toISOString().slice(0,10);
      const filename = `${slugify(list.label)}-${dateSlug}.png`;
      const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
      await offerFile(blob, filename, 'image/png');
    } catch (e) {
      if (e && e.code === 'declined') return;
      alert('Não foi possível gerar a imagem para partilhar.');
    }
  }

  async function exportAs(kind, selectedUids){
    const list = getActiveList();
    try {
      const canvas = await captureListCanvas(list, selectedUids);
      const dateSlug = new Date().toISOString().slice(0,10);
      const baseName = slugify(list.label) + '-' + dateSlug;
      if (kind === 'image'){
        const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
        await offerFile(blob, `${baseName}.png`, 'image/png');
      } else {
        const { jsPDF } = window.jspdf;
        const w = canvas.width, h = canvas.height;
        const pdf = new jsPDF({ orientation: w > h ? 'landscape' : 'portrait', unit: 'px', format: [w, h] });
        pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, w, h);
        const blob = pdf.output('blob');
        await offerFile(blob, `${baseName}.pdf`, 'application/pdf');
      }
    } catch (e) {
      if (e && e.code === 'declined') return;
      alert('Não foi possível gerar o ficheiro.');
    }
  }

  async function exportAllLists(kind){
    try {
      const canvases = [];
      for (const list of state.lists){ canvases.push(await captureListCanvas(list)); }
      const dateSlug = new Date().toISOString().slice(0,10);
      if (kind === 'pdf'){
        const { jsPDF } = window.jspdf;
        let pdf = null;
        canvases.forEach(canvas => {
          const w = canvas.width, h = canvas.height, orient = w > h ? 'landscape' : 'portrait';
          if (!pdf) pdf = new jsPDF({ orientation: orient, unit: 'px', format: [w, h] });
          else pdf.addPage([w, h], orient);
          pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, w, h);
        });
        const blob = pdf.output('blob');
        await offerFile(blob, `pedidos-todas-listas-${dateSlug}.pdf`, 'application/pdf');
      } else {
        const width = Math.max(...canvases.map(c => c.width));
        const gap = 24;
        const totalHeight = canvases.reduce((sum, c) => sum + c.height, 0) + gap * (canvases.length - 1);
        const combo = document.createElement('canvas');
        combo.width = width; combo.height = totalHeight;
        const ctx = combo.getContext('2d');
        ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--bg').trim() || '#ffffff';
        ctx.fillRect(0, 0, width, totalHeight);
        let y = 0;
        canvases.forEach(c => { ctx.drawImage(c, 0, y); y += c.height + gap; });
        const blob = await new Promise(res => combo.toBlob(res, 'image/png'));
        await offerFile(blob, `pedidos-todas-listas-${dateSlug}.png`, 'image/png');
      }
    } catch (e) {
      if (e && e.code === 'declined') return;
      alert('Não foi possível gerar o ficheiro combinado.');
    }
  }

  async function init(){
    render();
    if (window.claude && typeof window.claude.use === 'function'){
      try { capArtifact = await window.claude.use('artifact'); } catch(e){}
      try { capDownloads = await window.claude.use('downloads'); } catch(e){}
    }
    if (!capArtifact) setStatus('nocap'); else setStatus('idle');
  }

  init();
})();
</script>
